<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{TITLE}} — Eclipse Forge</title>
<style>
  :root { --bg:#000; --gold:#D4AF37; --gold-2:#C9A96E; --text:#F5F5F0; --muted:#a8a69d; --line:rgba(212,175,55,.25); }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:1040px; margin:0 auto; padding:32px 16px 48px; }
  .brand { font:500 12px/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing:.18em; text-transform:uppercase; color:var(--gold-2); }
  h1 { font:italic 600 clamp(26px,4vw,40px)/1.15 Outfit, Georgia, serif; color:var(--gold); margin:12px 0 6px; }
  .hello { color:var(--muted); margin:0 0 20px; }
  .hello[hidden] { display:none; }
  video { width:100%; max-height:76vh; background:#0b0b0b; border:1px solid var(--line); border-radius:12px; display:block; }
  .actions { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:20px; }
  .cta { display:inline-flex; align-items:center; min-height:48px; padding:0 22px; border-radius:10px; background:var(--gold); color:#000; font-weight:600; text-decoration:none; }
  .cta:hover { background:#e2c25a; }
  .cta:focus-visible { outline:2px solid var(--text); outline-offset:3px; }
  .note { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <div class="brand">Eclipse Forge · демо</div>
  <h1>{{TITLE}}</h1>
  <p class="hello" {{HAS_CLIENT}}>{{CLIENT}}, этот ролик записан для вас.</p>
  <video controls playsinline preload="metadata">
    <source src="/media/{{ID}}" type="{{TYPE}}">
    Ваш браузер не показывает видео. <a href="/media/{{ID}}">Скачать ролик</a>.
  </video>
  <div class="actions">
    <a class="cta" href="{{CONTACT}}" target="_blank" rel="noopener noreferrer">Обсудить в Telegram</a>
    <span class="note">Ответим в течение дня.</span>
  </div>
</main>
<script src="/assets/watch.js" data-id="{{ID}}"></script>
</body>
</html>
