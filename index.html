<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta
      name="description"
      content="Делаю сайты с системой заявок под ключ: клиент пишет — менеджер получает готовую карточку, владелец видит, что происходит. Цены открыто, смета до начала работ."
    />
    <meta property="og:title" content="Eclipse Forge — сайты с системой заявок под ключ" />
    <meta
      property="og:description"
      content="Сайты с системой заявок под ключ. Живые демо, открытые цены, смета до начала работ."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://eclipse-forge.ru/" />
    <meta property="og:image" content="https://eclipse-forge.ru/og-image.png" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eclipse Forge — сайты с системой заявок под ключ" />
    <meta
      name="twitter:description"
      content="Сайты с системой заявок под ключ. Живые демо, открытые цены, смета до начала работ."
    />
    <meta name="twitter:image" content="https://eclipse-forge.ru/og-image.png" />
    <link rel="canonical" href="https://eclipse-forge.ru/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Eclipse Forge — сайты с системой заявок под ключ</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://eclipse-forge.ru/#website",
            "url": "https://eclipse-forge.ru/",
            "name": "Eclipse Forge",
            "description": "Сайты с системой заявок под ключ для бизнеса. Павел Хопсон.",
            "inLanguage": ["ru", "en"],
            "publisher": { "@id": "https://eclipse-forge.ru/#pavel-hopson" }
          },
          {
            "@type": "Person",
            "@id": "https://eclipse-forge.ru/#pavel-hopson",
            "name": "Pavel Hopson",
            "url": "https://eclipse-forge.ru/",
            "sameAs": [
              "https://github.com/PavelHopson",
              "https://www.instagram.com/PavelHopson/",
              "https://t.me/EclipseForgeEngine"
            ]
          }
        ]
      }
    </script>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('ef-theme-mode') || 'dark';
          var resolved = mode;
          if (mode === 'auto') {
            var h = new Date().getHours();
            resolved = h >= 6 && h < 18 ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', resolved);

          var locale = localStorage.getItem('ef-locale') === 'en' ? 'en' : 'ru';
          document.documentElement.setAttribute('lang', locale);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.setAttribute('lang', 'ru');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
