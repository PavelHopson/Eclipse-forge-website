.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}
`;

const ROUTE = [[338.9887868041425,99.92975091853242],[423.4613605711327,193.42576853411364],[488.8372128976135,229.72938841482102],[571.8912364893214,246.41142808958014],[668.9005657479702,300.28131565450076],[711.5592712162797,325.1234799764031],[776.9351235427605,361.4270998571104],[854.8571947612895,436.62396268484343]];
const STAGES = [
  ["room", "запись", "MediaRecorder → File"],
  ["capture", "отправка", "POST message + attachment"],
  ["server", "проверка", "MIME + magic + disk + row"],
  ["agent", "транскрипция", "PENDING → Whisper"],
  ["result", "доставка", "Socket.IO → player"],
];
const stage = document.querySelector('.route-stage');
const packet = stage.querySelector('[data-packet]');
const readout = stage.closest('.iso-figure').querySelector('[data-readout]');
const nodes = [...stage.querySelectorAll('[data-node]')];
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
let progress = 0, target = 0, frame = 0, last = 0, clock = 0, touring = !reduce.matches, visible = false;
const phase = (value) => Math.min(STAGES.length - 1, Math.floor(clamp(value, 0, .999999) * STAGES.length));
const label = (value) => STAGES[phase(value)];
const pointAt = (value) => {
  const scaled = clamp(value, 0, 1) * (ROUTE.length - 1);
  const index = Math.min(ROUTE.length - 2, Math.floor(scaled));
  const share = scaled - index;
  return [ROUTE[index][0] + (ROUTE[index + 1][0] - ROUTE[index][0]) * share, ROUTE[index][1] + (ROUTE[index + 1][1] - ROUTE[index][1]) * share];
};
function draw() {
  const [x, y] = pointAt(progress);
  packet.setAttribute('cx', x.toFixed(2));
  packet.setAttribute('cy', y.toFixed(2));
  packet.dataset.fading = progress < .035 || progress > .965 ? 'true' : 'false';
  const [key, title, text] = label(progress);
  nodes.forEach((node) => node.toggleAttribute('data-active', node.dataset.node === key));
  const value = Math.round(progress * 100);
  readout.textContent = title + ' · ' + text;
  stage.setAttribute('aria-valuenow', String(value));
  stage.setAttribute('aria-valuetext', title + ' · ' + text);
}
function tourAt(t) {
  const cycle = t % 10;
  if (cycle < 8.6) return cycle / 8.6;
  return 1;
}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  if (touring) { clock += dt; target = tourAt(clock); if (clock % 10 > 9.2) target = 0; }
  progress = reduce.matches ? target : progress + (target - progress) * (1 - Math.exp(-dt / .22));
  if (Math.abs(target - progress) < .0005) progress = target;
  draw();
  frame = visible && (touring || Math.abs(target - progress) > .0005) ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
const steer = (value) => { touring = false; target = clamp(value, 0, 1); clock = 0; run(); };
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: '120px 0px' }).observe(stage);
stage.addEventListener('pointermove', (event) => { const box = stage.getBoundingClientRect(); steer(clamp((event.clientX - box.left) / box.width, 0, 1)); });
stage.addEventListener('pointerleave', () => { touring = false; });
stage.addEventListener('keydown', (event) => {
  if (event.key === 'ArrowRight' || event.key === 'ArrowUp') { event.preventDefault(); steer(target + .1); }
  if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') { event.preventDefault(); steer(target - .1); }
  if (event.key === 'Home') { event.preventDefault(); steer(0); }
  if (event.key === 'End') { event.preventDefault(); steer(1); }
  if (event.key === ' ' || event.key === 'Enter') { event.preventDefault(); touring = true; clock = 0; run(); }
  if (event.key === 'Escape') { event.preventDefault(); touring = false; target = progress; }
});
reduce.addEventListener?.('change', () => { if (reduce.matches) { touring = false; target = progress; } });
draw();
</script></body></html>
